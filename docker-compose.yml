version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: entertainment_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elgroup_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PasswordAman123!}
      POSTGRES_DB: ${POSTGRES_DB:-elgroup_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - entertainment_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: entertainment_n8n
    restart: always
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.madamvita.com}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_HOST:-n8n.madamvita.com}/
      - GENERIC_TIMEZONE=Asia/Jakarta
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      - postgres
    networks:
      - entertainment_net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: entertainment_wa
    restart: always
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_API_KEY=${WA_API_KEY:-elgroup_wa_secret_2026}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-elgroup_user}:${POSTGRES_PASSWORD:-PasswordAman123!}@postgres:5432/${POSTGRES_DB:-elgroup_db}?schema=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_wa
      - WEBSOCKET_ENABLED=true
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - DEL_INSTANCE=false
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - entertainment_net

volumes:
  postgres_data:
  n8n_data:

networks:
  entertainment_net:
    driver: bridge
